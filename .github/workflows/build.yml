name: Build

on:
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  # Build the Penguin QEMU release artifact (penguin-qemu.tar.gz) from the Nix
  # flake. The build is expensive (libqemu-system-*.so for the full system arch
  # matrix), so it leans on the shared rehosting-tools Cachix cache via
  # rehosting/ci's nix-setup. PR builds pull from the cache but do not push
  # (handled by nix-setup's skip-push default); pushes/main populate it.
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Set up Nix
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-backend: cachix
          cachix-name: rehosting-tools
          cachix-auth-token: ${{ secrets.CACHIX_REHOSTING }}
          # No VM needed; avoids install-nix-action's KVM/udevadm step that
          # fails on Arc pods which expose /dev/kvm without a working udevd.
          enable-kvm: false
          extra-nix-config: |
            max-jobs = 8
            cores = 8

      - name: Flake check
        run: nix flake check -L

      - name: Build release artifact
        run: |
          set -eux
          nix build -L .#dist
          cp --dereference result penguin-qemu.tar.gz

      - name: Verify artifact layout
        run: |
          set -eux
          test -s penguin-qemu.tar.gz
          tar tzf penguin-qemu.tar.gz | grep -q '^lib/libqemu-system-'
          tar tzf penguin-qemu.tar.gz | grep -q '^include/penguin-qemu-cffi/'
          tar tzf penguin-qemu.tar.gz | grep -q '^lib/penguin-qemu-env/'
          tar tzf penguin-qemu.tar.gz | grep -q '^bin/qemu-img$'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: penguin-qemu.tar.gz
          path: penguin-qemu.tar.gz
          retention-days: 7
